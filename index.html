   <div data-template-id="win-panel" class="canva-panel pop rounded-3xl p-8 max-w-md w-full text-center shadow-2xl" role="dialog" aria-modal="true" aria-labelledby="win-h">

     🏆🇮🇩

  <script>
const TEAM_NAMES=['Kelompok Merah','Kelompok Biru','Kelompok Hijau','Kelompok Kuning'];
const TEAM_COLORS=['#dc2626','#2563eb','#16a34a','#ca8a04'];
let scores,turn,matched,lines,sel,drag;
const play=document.getElementById('play'),svg=document.getElementById('lines');
const teams=[...document.querySelectorAll('.team-card')];

function dotPos(card){
  const d=card.querySelector('.dot').getBoundingClientRect(),p=play.getBoundingClientRect();
  return {x:d.left+d.width/2-p.left,y:d.top+d.height/2-p.top};
}
function mkLine(a,b,color,dash){
  const l=document.createElementNS('http://www.w3.org/2000/svg','line');
  l.setAttribute('x1',a.x);l.setAttribute('y1',a.y);l.setAttribute('x2',b.x);l.setAttribute('y2',b.y);
  l.setAttribute('stroke',color);l.setAttribute('stroke-width','6');l.setAttribute('stroke-linecap','round');
  if(dash)l.setAttribute('stroke-dasharray','10 8');
  svg.appendChild(l);return l;
}
function redraw(){
  svg.innerHTML='';
  lines.forEach(o=>mkLine(dotPos(o.a),dotPos(o.b),o.color));
}
function shuffle(){
  const order=[0,1,2,3,4].sort(()=>Math.random()-.5);
  if(order.every((v,i)=>v===i))order.reverse();
  document.querySelectorAll('#right-col .card').forEach((c,i)=>c.style.order=order[i]);
}
function renderTeams(){
  teams.forEach((t,i)=>{t.querySelector('.score').textContent=scores[i];t.classList.toggle('active',i===turn);});
  document.getElementById('turn-name').textContent=TEAM_NAMES[turn];
  document.getElementById('turn-name').style.color=TEAM_COLORS[turn];
}
let fbTimer;
function feedback(ok){
  const a=document.getElementById(ok?'fb-ok':'fb-bad'),b=document.getElementById(ok?'fb-bad':'fb-ok');
  b.classList.add('hidden');a.classList.remove('hidden');
  a.classList.remove('pop');void a.offsetWidth;a.classList.add('pop');
  clearTimeout(fbTimer);fbTimer=setTimeout(()=>a.classList.add('hidden'),1600);
}
function tone(ok){
  try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();
    o.frequency.value=ok?660:200;o.type=ok?'sine':'square';g.gain.value=.08;o.connect(g);g.connect(c.destination);
    o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);o.stop(c.currentTime+.4);}catch(e){}
}
function attempt(L,R){
  if(L.classList.contains('done')||R.classList.contains('done'))return;
  if(L.dataset.key===R.dataset.key){
    L.classList.add('done');R.classList.add('done');
    lines.push({a:L,b:R,color:TEAM_COLORS[turn]});redraw();
    scores[turn]+=10;matched++;feedback(true);tone(true);renderTeams();
    if(matched===5)setTimeout(showWin,700);
  }else{
    const l=mkLine(dotPos(L),dotPos(R),'#ef4444',true);
    setTimeout(()=>l.remove(),700);
    feedback(false);tone(false);turn=(turn+1)%4;renderTeams();
  }
}
function showWin(){
  const max=Math.max(...scores);
  const w=TEAM_NAMES.filter((n,i)=>scores[i]===max).join(' & ');
  document.getElementById('winner').textContent=w+' ('+max+' poin)';
  document.getElementById('win').classList.remove('hidden');
  document.getElementById('again-btn').focus();
}
function clearSel(){if(sel)sel.classList.remove('selected');sel=null;}
function pick(card){
  if(card.classList.contains('done'))return;
  if(!sel){sel=card;card.classList.add('selected');return;}
  if(sel===card){clearSel();return;}
  if(sel.dataset.side===card.dataset.side){clearSel();sel=card;card.classList.add('selected');return;}
  const L=sel.dataset.side==='L'?sel:card,R=sel.dataset.side==='L'?card:sel;
  clearSel();attempt(L,R);
}
document.querySelectorAll('.card').forEach(c=>{
  c.addEventListener('pointerdown',e=>{
    if(c.classList.contains('done'))return;
    e.preventDefault();
    drag={from:c,moved:false,start:{x:e.clientX,y:e.clientY},line:null};
  });
  c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(c);}});
});
window.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.start.x,e.clientY-drag.start.y)>8){
    drag.moved=true;clearSel();drag.line=mkLine(dotPos(drag.from),dotPos(drag.from),TEAM_COLORS[turn],true);
  }
  if(drag.line){const p=play.getBoundingClientRect();drag.line.setAttribute('x2',e.clientX-p.left);drag.line.setAttribute('y2',e.clientY-p.top);}
});
window.addEventListener('pointerup',e=>{
  if(!drag)return;
  const d=drag;drag=null;
  if(!d.moved){pick(d.from);return;}
  d.line&&d.line.remove();
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const t=el&&el.closest('.card');
  if(t&&t.dataset.side!==d.from.dataset.side){
    const L=d.from.dataset.side==='L'?d.from:t,R=d.from.dataset.side==='L'?t:d.from;attempt(L,R);
  }
});
function reset(){
  scores=[0,0,0,0];turn=0;matched=0;lines=[];sel=null;drag=null;
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('done','selected'));
  document.getElementById('win').classList.add('hidden');
  shuffle();svg.innerHTML='';renderTeams();
}
document.getElementById('reset-btn').addEventListener('click',reset);
document.getElementById('again-btn').addEventListener('click',reset);
document.getElementById('next-btn').addEventListener('click',()=>{turn=(turn+1)%4;clearSel();renderTeams();});
window.addEventListener('resize',()=>requestAnimationFrame(redraw));
reset();
</script>
